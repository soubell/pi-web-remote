# Pi Web + Caddy(Let's Encrypt/DNS-01) + oauth2-proxy(GitHub ログイン)
#
#   公開ポートは 443 のみ。80 は DNS-01 なので不要。
#   Pi Web はホスト側 127.0.0.1:30141 で動かす前提（extra_hosts で host.docker.internal 経由）。
services:
  caddy:
    build: .
    image: pi-web-caddy:local
    container_name: pi-web-caddy
    restart: unless-stopped
    env_file:
      - .env.caddy
    ports:
      - "443:443"
      - "443:443/udp"        # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # 証明書。消すと再取得になり Let's Encrypt のレート制限に当たる
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - oauth2-proxy

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    container_name: pi-web-oauth
    restart: unless-stopped
    env_file:
      - .env.oauth
    # Caddy からの forward_auth だけを受ける（ホストには公開しない）
    expose:
      - "4180"

volumes:
  caddy_data:
  caddy_config:
