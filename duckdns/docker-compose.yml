# Pi Web + Caddy（DuckDNS / Let's Encrypt / Basic 認証）
#
#   公開ポートは 443 のみ。80 は DNS-01 チャレンジなので不要。
#   Pi Web はホスト側 127.0.0.1:30141 で動かす前提（extra_hosts 経由で届かせる）。
services:
  caddy:
    build: .
    image: pi-web-caddy:local
    container_name: pi-web-caddy
    restart: unless-stopped
    env_file:
      - .env.caddy
    ports:
      - "443:443"
      - "443:443/udp"     # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data  # 証明書。消すと再取得になり Let's Encrypt のレート制限に当たる
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  caddy_data:
  caddy_config:
